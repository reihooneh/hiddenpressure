name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the code and nothing else unless they say so.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned test browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Check the committed site matches the sources
        run: |
          npm run build
          git diff --exit-code -- site
      - name: Data, model and browser tests
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Publish only the built site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
